<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7db1ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Home Board</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts only download when a theme uses them (Pixelify Sans is the Blocks theme). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..800&family=Pixelify+Sans:wght@400..700&display=swap"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/scene.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/keyboard.css" />
    <link rel="stylesheet" href="css/apps/shopping.css" />
    <link rel="stylesheet" href="css/apps/weather.css" />
    <link rel="stylesheet" href="css/apps/notes.css" />
    <link rel="stylesheet" href="css/apps/calendar.css" />
    <link rel="stylesheet" href="css/apps/games.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sky__stars"></div>
      <div class="sky__glow"></div>
      <!-- Blocks theme only (scene.css). -->
      <div class="sky__sun"></div>
      <div class="sky__moon"></div>
      <div class="sky__clouds">
        <span class="sky__cloud sky__cloud--1"></span>
        <span class="sky__cloud sky__cloud--2"></span>
        <span class="sky__cloud sky__cloud--3"></span>
      </div>
      <div class="sky__scenery"></div>
    </div>

    <!-- The board is a fixed 1920×1080 canvas (96rem × 54rem); phones get the compact layout. -->
    <div class="board">
      <header class="statusbar">
        <span class="statusbar__time"></span>
        <div class="statusbar__end">
          <span class="sync" role="status"></span>
        </div>
      </header>

      <main class="home" aria-label="Home screen">
        <!-- Pages slide sideways (pager.js); page 1 also holds the clock. -->
        <div class="pager">
          <div class="pager__track">
            <section class="home-page" aria-label="Page 1">
              <section class="clock" aria-label="Clock">
                <p class="clock__date"></p>
                <time class="clock__time"><span class="clock__hm"></span><span class="clock__period"></span></time>
              </section>
            </section>
          </div>
        </div>
        <div class="page-dots" role="group" aria-label="Pages" hidden></div>
        <nav class="dock" aria-label="Apps"></nav>
        <!-- Blocks theme critters (scene/blocks-scene.js). -->
        <div class="home__scene"></div>
      </main>

      <div class="app-shell" hidden></div>
      <div class="toasts" aria-live="polite"></div>
    </div>

    <noscript>The board needs JavaScript turned on.</noscript>
  </body>
</html>
