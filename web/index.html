<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7db1ea" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Home Board</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts only download when a theme uses them (Press Start 2P and Pixelify Sans are Retro). -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Figtree:wght@400..800&family=Pixelify+Sans:wght@400..700&family=Press+Start+2P&display=swap"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/keyboard.css" />
    <link rel="stylesheet" href="css/apps/shopping.css" />
    <link rel="stylesheet" href="css/apps/weather.css" />
    <link rel="stylesheet" href="css/apps/notes.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="sky" aria-hidden="true">
      <div class="sky__stars"></div>
      <div class="sky__glow"></div>
      <div class="sky__scenery"></div>
    </div>

    <!-- The board is a fixed 1920×1080 canvas (96rem × 54rem); phones get the compact layout. -->
    <div class="board">
      <header class="statusbar">
        <span class="statusbar__time"></span>
        <div class="statusbar__end">
          <span class="sync" role="status"></span>
        </div>
      </header>

      <main class="home" aria-label="Home screen">
        <section class="clock" aria-label="Clock">
          <p class="clock__date"></p>
          <time class="clock__time"></time>
        </section>
        <div class="home__widgets"></div>
        <nav class="dock" aria-label="Apps"></nav>
      </main>

      <div class="app-shell" hidden></div>
      <div class="toasts" aria-live="polite"></div>
    </div>

    <noscript>The board needs JavaScript turned on.</noscript>
  </body>
</html>
